[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (> 5 s)
    integration: requires real DB or heavy services
    e2e: end-to-end pipeline tests
    api: FastAPI endpoint tests

# Default: run everything except slow
addopts =
    -v
    --tb=short
    -m "not slow"
    --strict-markers

# Ignore backend app code when collecting tests
collect_ignore = ["backend", "scripts", "evaluation"]
