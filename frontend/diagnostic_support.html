<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Diagnostic Support</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .search-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-box h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-input-group button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .search-input-group button:hover {
            background: #5568d3;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .results {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .issue-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .issue-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .issue-card .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .issue-card .problem {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .issue-card .severity {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .severity.high {
            background: #ffe0e0;
            color: #d32f2f;
        }

        .severity.medium {
            background: #fff4e0;
            color: #f57c00;
        }

        .severity.low {
            background: #e0f7fa;
            color: #0097a7;
        }

        .issue-card .type-badge {
            display: inline-block;
            padding: 3px 10px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .issue-card .solution {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .issue-card .sql-query {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .issue-card .issue-header {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Step-by-step diagnostic modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #667eea;
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .close-modal:hover {
            color: #333;
        }

        .step-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .step-header {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .step-text {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .step-sql {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
            margin-bottom: 15px;
        }

        .feedback-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .feedback-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-fixed {
            background: #4caf50;
            color: white;
        }

        .btn-fixed:hover {
            background: #45a049;
        }

        .btn-not-fixed {
            background: #f57c00;
            color: white;
        }

        .btn-not-fixed:hover {
            background: #ef6c00;
        }

        .btn-close {
            background: #999;
            color: white;
        }

        .btn-close:hover {
            background: #777;
        }

        .step-history {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }

        .step-history h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .history-item {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }

        .history-item.resolved {
            border-left-color: #4caf50;
        }

        .history-item.continued {
            border-left-color: #f57c00;
        }

        .btn-start-workflow {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-start-workflow:hover {
            background: #5568d3;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-badge.active {
            background: #2196f3;
            color: white;
        }

        .status-badge.resolved {
            background: #4caf50;
            color: white;
        }

        .status-badge.unresolved {
            background: #f57c00;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 NEO Diagnostic Support</h1>
            <p>Intelligent troubleshooting for bot and station issues</p>
        </div>

        <div class="stats-grid" id="stats">
            <!-- Stats loaded dynamically -->
        </div>

        <div class="search-box">
            <h2>Search for Solutions</h2>
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="Enter problem description (e.g., 'bot stuck', 'station pick failed')">
                <button onclick="searchIssues()">Search</button>
            </div>
            <div class="filter-group">
                <select id="issueTypeFilter">
                    <option value="">All Types</option>
                    <option value="BOT_LEVEL">Bot Level</option>
                    <option value="STATION_LEVEL">Station Level</option>
                </select>
                <select id="severityFilter">
                    <option value="">All Severities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>

        <div class="results">
            <h2>Search Results</h2>
            <div id="resultsContainer">
                <div class="no-results">Enter a search query to find solutions</div>
            </div>
        </div>
    </div>

    <!-- Step-by-step diagnostic modal -->
    <div id="diagnosticModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔍 Step-by-Step Diagnostic</h2>
                <button class="close-modal" onclick="closeDiagnosticModal()">×</button>
            </div>
            
            <div id="diagnosticContent">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        let currentSession = null;

        // Load statistics on page load
        async function loadStatistics() {
            try {
                const response = await fetch('/api/diagnostic-support/statistics');
                const data = await response.json();
                
                const stats = data.data;
                const statsHtml = `
                    <div class="stat-card">
                        <h3>Total Issues</h3>
                        <div class="number">${stats.total_issues}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Bot Level</h3>
                        <div class="number">${stats.bot_level_count}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Station Level</h3>
                        <div class="number">${stats.station_level_count}</div>
                    </div>
                    <div class="stat-card">
                        <h3>High Severity</h3>
                        <div class="number">${stats.severity.high}</div>
                    </div>
                `;
                
                document.getElementById('stats').innerHTML = statsHtml;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // Search for issues
        async function searchIssues() {
            const query = document.getElementById('searchInput').value.trim();
            const issueType = document.getElementById('issueTypeFilter').value;
            const severity = document.getElementById('severityFilter').value;
            
            if (!query) {
                alert('Please enter a search query');
                return;
            }
            
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
            
            try {
                const response = await fetch('/api/diagnostic-support/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        issue_type: issueType || null
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.message);
                }
                
                const results = data.data.results;
                
                // Filter by severity if selected
                const filteredResults = severity 
                    ? results.filter(r => r.severity === severity)
                    : results;
                
                if (filteredResults.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">No matching solutions found. Try different keywords.</div>';
                    return;
                }
                
                const resultsHtml = filteredResults.map(issue => `
                    <div class="issue-card">
                        <div class="issue-header">
                            <div class="problem">${issue.problem}</div>
                            <div class="severity ${issue.severity.toLowerCase()}">${issue.severity}</div>
                        </div>
                        <div class="type-badge">${issue.type.replace('_', ' ')}</div>
                        <div class="solution">
                            <strong>Solution:</strong><br>
                            ${issue.solution}
                        </div>
                        ${issue.sql_query && issue.sql_query.trim() ? `
                            <div class="sql-query">
                                <strong>SQL Query:</strong><br>
                                ${issue.sql_query}
                            </div>
                        ` : ''}
                        ${issue.reported_to_dev === 'Y' ? `
                            <div style="margin-top: 10px; color: #f57c00;">
                                ⚠️ Note: This issue may require developer attention
                            </div>
                        ` : ''}
                        <button class="btn-start-workflow" onclick="startDiagnosticWorkflow(${issue.s_no}, '${issue.type === 'BOT_LEVEL' ? 'bot_level' : 'station_level'}')">
                            🔍 Start Step-by-Step Diagnostic
                        </button>
                    </div>
                `).join('');
                
                resultsContainer.innerHTML = resultsHtml;
                
            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
            }
        }

        // Start diagnostic workflow
        async function startDiagnosticWorkflow(issueId, issueType) {
            try {
                const response = await fetch('/api/diagnostic-support/session/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        issue_id: issueId,
                        issue_type: issueType
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    alert('Error: ' + data.message);
                    return;
                }
                
                currentSession = data.data;
                displayCurrentStep(data.data);
                
                // Show modal
                document.getElementById('diagnosticModal').classList.add('active');
                
            } catch (error) {
                console.error('Error starting workflow:', error);
                alert('Failed to start diagnostic workflow: ' + error.message);
            }
        }

        // Display current step
        function displayCurrentStep(sessionData) {
            const currentStep = sessionData.current_step;
            const history = sessionData.history || [];
            
            let content = `
                <div style="background: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                    <strong>Problem:</strong> ${sessionData.problem}<br>
                    <strong>Severity:</strong> <span class="severity ${sessionData.severity.toLowerCase()}">${sessionData.severity}</span><br>
                    <strong>Status:</strong> <span class="status-badge ${sessionData.status || 'active'}">${(sessionData.status || 'active').toUpperCase()}</span>
                </div>
                
                <div class="step-container">
                    <div class="step-header">
                        Step ${currentStep.step_number} of ${sessionData.total_steps}
                    </div>
                    
                    <div class="step-text">
                        ${currentStep.step_text}
                    </div>
                    
                    ${currentStep.sql_query ? `
                        <div>
                            <strong>SQL Query to Execute:</strong>
                            <div class="step-sql">${currentStep.sql_query}</div>
                            <p style="color: #666; font-size: 0.9em; margin-top: 10px;">
                                📝 Execute this query in your database and check if the issue is resolved.
                            </p>
                        </div>
                    ` : `
                        <p style="color: #666;">No SQL query for this step. Follow the instructions above.</p>
                    `}
                    
                    <div class="feedback-buttons">
                        <button class="btn-fixed" onclick="submitFeedback(true)">
                            ✅ Issue Fixed
                        </button>
                        <button class="btn-not-fixed" onclick="submitFeedback(false)">
                            ➡️ Not Fixed - Next Step
                        </button>
                    </div>
                </div>
            `;
            
            // Add history if exists
            if (history.length > 0) {
                content += `
                    <div class="step-history">
                        <h3>Previous Steps</h3>
                        ${history.map((item, idx) => `
                            <div class="history-item ${item.is_fixed ? 'resolved' : 'continued'}">
                                <strong>Step ${item.step_number}:</strong> ${item.step_text}<br>
                                <span style="color: ${item.is_fixed ? '#4caf50' : '#f57c00'};">
                                    ${item.is_fixed ? '✅ Fixed' : '➡️ Continued to next step'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            document.getElementById('diagnosticContent').innerHTML = content;
        }

        // Submit step feedback
        async function submitFeedback(isFixed) {
            if (!currentSession || !currentSession.session_id) {
                alert('No active session');
                return;
            }
            
            try {
                const response = await fetch('/api/diagnostic-support/session/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: currentSession.session_id,
                        is_fixed: isFixed,
                        feedback_notes: ""
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    alert('Error: ' + data.message);
                    return;
                }
                
                const result = data.data;
                
                // Check if resolved or unresolved
                if (result.status === 'resolved') {
                    document.getElementById('diagnosticContent').innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <div style="font-size: 4em; margin-bottom: 20px;">✅</div>
                            <h2 style="color: #4caf50; margin-bottom: 15px;">Issue Resolved!</h2>
                            <p style="font-size: 1.1em; color: #666; margin-bottom: 30px;">
                                ${result.message}
                            </p>
                            <button class="btn-close" onclick="closeDiagnosticModal()">Close</button>
                        </div>
                    `;
                } else if (result.status === 'unresolved') {
                    document.getElementById('diagnosticContent').innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <div style="font-size: 4em; margin-bottom: 20px;">⚠️</div>
                            <h2 style="color: #f57c00; margin-bottom: 15px;">Issue Not Resolved</h2>
                            <p style="font-size: 1.1em; color: #666; margin-bottom: 30px;">
                                ${result.message}
                            </p>
                            <p style="color: #999;">Consider escalating this issue to the development team.</p>
                            <button class="btn-close" onclick="closeDiagnosticModal()" style="margin-top: 20px;">Close</button>
                        </div>
                    `;
                } else {
                    // Continue to next step
                    currentSession = {
                        ...currentSession,
                        current_step: result.next_step,
                        history: result.history,
                        status: result.status
                    };
                    displayCurrentStep(currentSession);
                }
                
            } catch (error) {
                console.error('Error submitting feedback:', error);
                alert('Failed to submit feedback: ' + error.message);
            }
        }

        // Close diagnostic modal
        function closeDiagnosticModal() {
            document.getElementById('diagnosticModal').classList.remove('active');
            currentSession = null;
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchIssues();
            }
        });

        // Load statistics on page load
        loadStatistics();
    </script>
</body>
</html>
